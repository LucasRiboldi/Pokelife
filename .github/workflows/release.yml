name: Release PokeLife

on: workflow_dispatch

permissions:
  contents: write

concurrency:
  group: pokelife-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Select version
        id: version
        shell: pwsh
        run: |
          $tags = git tag --list --sort=-version:refname
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $latest = $tags | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | Select-Object -First 1
          $version = '0.1.0'
          if ($latest) {
            $previous = [version]$latest.Substring(1)
            $version = "$($previous.Major).$($previous.Minor).$($previous.Build + 1)"
          }
          "number=$version" >> $env:GITHUB_OUTPUT
      - name: Build and test
        shell: pwsh
        run: |
          dotnet build TaskbarHabitat.sln -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/TaskbarHabitat.Simulation.Tests/TaskbarHabitat.Simulation.Tests.csproj -c Release --no-build
          exit $LASTEXITCODE
      - name: Package Windows x64
        id: package
        shell: pwsh
        env:
          POKELIFE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'pokelife-publish'
          dotnet publish src/TaskbarHabitat.Widget/TaskbarHabitat.Widget.csproj -c Release -r win-x64 --self-contained true "-p:Version=$env:POKELIFE_VERSION" -o $publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $archive = Join-Path $env:RUNNER_TEMP "PokeLife-v$env:POKELIFE_VERSION-windows-x64.zip"
          [IO.Compression.ZipFile]::CreateFromDirectory($publish, $archive)
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $entries = $zip.Entries.FullName
            foreach ($file in @('TaskbarHabitat.Widget.exe', 'TaskbarHabitat.Widget.pri', 'coreclr.dll', 'Microsoft.UI.Xaml.dll', 'e_sqlite3.dll', 'Assets/Habitats/ViridianAmpliada/navigation.json')) {
              if ($file -notin $entries) { throw "Missing ZIP entry: $file" }
            }
          } finally {
            $zip.Dispose()
          }
          "archive=$archive" >> $env:GITHUB_OUTPUT
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          POKELIFE_VERSION: ${{ steps.version.outputs.number }}
          POKELIFE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          $tag = "v$env:POKELIFE_VERSION"
          $notes = @'
          Protótipo do PokeLife para Windows 11 x64.

          1. Baixe o ZIP do PokeLife em **Assets**.
          2. Extraia todos os arquivos para uma pasta.
          3. Abra `TaskbarHabitat.Widget.exe`.

          O pacote inclui os runtimes do .NET e do Windows App SDK. O save fica em `%LOCALAPPDATA%\TaskbarHabitat\save.db`.

          [Créditos dos recursos](https://github.com/LucasRiboldi/Pokelife/blob/main/docs/ASSETS.md)
          '@
          gh release create $tag $env:POKELIFE_ARCHIVE --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "PokeLife $tag" --notes $notes --generate-notes --latest
          exit $LASTEXITCODE
